name: Mi primer workflow de GitHub Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imprimir_info:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Imprimir Mensaje Personalizado
        shell: bash
        run: |
          echo "Hola, somos Quinnie y Diego y este es nuestro primer workflow!"
          echo "La fecha y hora actual es: $(date)"

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ejecutar script Python
        run: python mi_script.py
